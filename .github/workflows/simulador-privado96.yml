name: "Simulador privado · Martín y Cloudflare Pages"

on:
  pull_request:
    branches: [main]
    paths:
      - "_routes.json"
      - "functions/admin/simulador-llaves.html.js"
      - "admin/simulador-llaves.html"
      - "tests/simulador-privado96.test.js"
      - ".github/workflows/simulador-privado96.yml"
  push:
    branches: [main]
    paths:
      - "_routes.json"
      - "functions/admin/simulador-llaves.html.js"
      - "admin/simulador-llaves.html"
      - "tests/simulador-privado96.test.js"
      - ".github/workflows/simulador-privado96.yml"
  workflow_dispatch:

jobs:
  simulador-acceso:
    name: "Simulador · Identidad Martín y regresiones"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Verificar acceso Martín, denegaciones y 265+ tests del sistema"
        run: |
          node --test tests/simulador-privado96.test.js
          node --test tests/*.test.js
      - name: "Compilar Pages Functions sin desplegar"
        run: |
          mkdir -p .tmp
          npx --yes wrangler@4.47.0 pages functions build functions \
            --outdir=.tmp/pages-worker \
            --output-routes-path=.tmp/routes-compiled.json
          node - <<'NODE'
          const fs = require("node:fs");
          const target = "/admin/simulador-llaves.html";
          const routes = JSON.parse(fs.readFileSync(".tmp/routes-compiled.json","utf8"));
          if (routes.version !== 1 || !routes.include.includes(target)) {
            throw new Error("La función Cloudflare no intercepta el enlace exacto al simulador");
          }
          if (fs.existsSync("admin/simulador-llaves.html")) {
            throw new Error("No publicar el HTML original como archivo estático");
          }
          console.log("Ruta privada compilada:", target);
          NODE
      - name: "Verificar Cloudflare Preview sin sesión (no leer llaves)"
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, time
          url = "https://security-simulador-martin-pa.boulevard-padel.pages.dev/admin/simulador-llaves.html"
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(url,timeout=15) as r:
                      body=r.read().decode("utf8")
                      assert r.status==200 and "Verificando el acceso" in body
                      assert "BPReglamento2026.groupPlan(n)" not in body
                      assert "no-store" in r.headers.get("Cache-Control","")
                  req=urllib.request.Request(url,method="POST",headers={"Accept":"text/html"})
                  try:
                      urllib.request.urlopen(req,timeout=15)
                      raise RuntimeError("POST sin JWT dejó ver simulador")
                  except urllib.error.HTTPError as e:
                      assert e.code == 403, f"Esperábamos 403, llegó {e.code}"
                  print("Cloudflare Preview: GET puerta privada; POST sin JWT = 403")
                  break
              except Exception:
                  if attempt==4: raise
                  time.sleep(3)
          PY
