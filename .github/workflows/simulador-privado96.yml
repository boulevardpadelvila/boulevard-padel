name: "Simulador privado · Martín y Cloudflare Pages"

on:
  pull_request:
    branches: [main]
    paths:
      - "_routes.json"
      - "functions/admin/simulador-llaves.html.js"
      - "admin/simulador-llaves.html"
      - "tests/simulador-privado96.test.js"
      - ".github/workflows/simulador-privado96.yml"
  push:
    branches: [main]
    paths:
      - "_routes.json"
      - "functions/admin/simulador-llaves.html.js"
      - "admin/simulador-llaves.html"
      - "tests/simulador-privado96.test.js"
      - ".github/workflows/simulador-privado96.yml"
  workflow_dispatch:

jobs:
  simulador-acceso:
    name: "Simulador · Identidad Martín y regresiones"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Verificar acceso Martín, denegaciones y 265+ tests del sistema"
        run: |
          node --test tests/simulador-privado96.test.js
          node --test tests/*.test.js
      - name: "Compilar Pages Functions sin desplegar"
        run: |
          mkdir -p .tmp
          npx --yes wrangler@4.47.0 pages functions build functions \
            --outdir=.tmp/pages-worker \
            --output-routes-path=.tmp/routes-compiled.json
          node - <<'NODE'
          const fs = require("node:fs");
          const target = "/admin/simulador-llaves.html";
          const routes = JSON.parse(fs.readFileSync(".tmp/routes-compiled.json","utf8"));
          if (routes.version !== 1 || !routes.include.includes(target)) {
            throw new Error("La función Cloudflare no intercepta el enlace exacto al simulador");
          }
          if (fs.existsSync("admin/simulador-llaves.html")) {
            throw new Error("No publicar el HTML original como archivo estático");
          }
          console.log("Ruta privada compilada:", target);
          NODE
      - name: "Probar Pages Function real en localhost sin acceso"
        run: |
          npx --yes wrangler@4.47.0 pages dev . --ip=127.0.0.1 --port=8788 > .tmp/wrangler-local.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import urllib.request, urllib.error, time
          base="http://127.0.0.1:8788"
          url=base+"/admin/simulador-llaves.html"
          for attempt in range(25):
              try:
                  with urllib.request.urlopen(url,timeout=3) as response:
                      assert response.status==200
                      body=response.read().decode("utf8")
                      assert "Verificando el acceso" in body
                      assert "BPReglamento2026.groupPlan(n)" not in body
                      assert "no-store" in response.headers.get("Cache-Control","")
                  break
              except Exception:
                  if attempt==24: raise
                  time.sleep(1)
          req=urllib.request.Request(url,method="POST",headers={"Accept":"text/html"})
          try:
              urllib.request.urlopen(req,timeout=10)
              raise AssertionError("POST sin token entregó datos")
          except urllib.error.HTTPError as e:
              assert e.code==403, f"POST anónimo debe dar 403, no {e.code}"
          with urllib.request.urlopen(base+"/index.html",timeout=10) as response:
              home=response.read().decode("utf8")
              assert response.status==200 and "Boulevard" in home
          print("Cloudflare Pages local: GET puerta sin llaves; POST anónimo 403; home pública sin cambios")
          PY
