name: Validacion Liga 82 (temporal)
on:
  push:
    branches:
      - desarrollo/modalidad-liga-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Suite completa
        run: node --test tests/*.test.js
      - name: Verificar sintaxis JS de Liga
        run: |
          node --check js/admin-liga82.js
          node --check js/torneos-liga-motor.js
          node --check js/torneos-liga-public82.js
