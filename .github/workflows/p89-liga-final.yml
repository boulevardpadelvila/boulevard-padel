name: "Parche 89 · Liga · pruebas"
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/p89-liga-final.yml"
      - "js/torneos-liga-*.js"
      - "js/admin-liga-final89-ui.js"
      - "js/torneos-public.js"
      - "css/torneos-liga-final89.css"
      - "css/admin-liga-final89-ui.css"
      - "tests/torneos-liga-*.test.js"
      - "tests/torneos-liga-final89-browser.test.cjs"
      - "sql/SQL_89_LIGA_FASE_FINAL_CONSOLIDADO_BORRADOR.sql"
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Sintaxis JS P89"
        run: |
          node --check js/torneos-liga-final89.js
          node --check js/admin-liga82.js
          node --check js/admin-liga-final89-ui.js
          node --check js/torneos-liga-final89-public.js
          node --check js/torneos-public.js
          node --check tests/torneos-liga-final89-public.test.js
          node --check tests/torneos-liga-final89.test.js
          node --check tests/torneos-liga-final89-admin.test.js
          node --check tests/torneos-liga-apertura2027-auditoria.test.js
      - name: "Suite completa"
        run: node --test tests/*.test.js

  sql-postgresql17:
    name: "SQL89 PostgreSQL 17 aislado"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: p89test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: p89_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p89test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: p89test
      PGUSER: postgres
      PGPASSWORD: p89_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: "Cliente PostgreSQL para base temporal"
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: "Montar dependencias de ensayo"
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/p89_postgres_bootstrap.sql
      - name: "Paridad ampliada con restricciones y reservas ficticias"
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/p89_live_schema_parity.sql
      - name: "Compilar y aplicar SQL89 SOLO en Postgres temporal"
        run: psql -X -v ON_ERROR_STOP=1 -f sql/SQL_89_LIGA_FASE_FINAL_CONSOLIDADO_BORRADOR.sql
      - name: "Pruebas reales de RPC, bloqueos, fase final y borrado"
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/p89_postgres_smoke.sql
      - name: "Concurrencia: INSERT regular frente a creación de semifinales"
        run: bash tests/fixtures/p89_postgres_race.sh
      - name: "No regresión: reservas y turnos fijos heredados"
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/p89_live_schema_postcheck.sql
      - name: "Empate absoluto: resolución manual por administrador y auditoría"
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/p89_postgres_manual_tiebreak.sql
      - name: "Permisos reales PostgreSQL: authenticated / anon, RPC y RLS"
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/p89_postgres_auth_roles.sql
      - name: "Temporada completa ficticia: 12 parejas, 66 partidos, 11 Fechas"
        run: |
          node --check tests/fixtures/p89_postgres_12pairs.js
          node tests/fixtures/p89_postgres_12pairs.js > /tmp/p89_12pairs.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/p89_12pairs.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/p89_postgres_12pairs_check.sql

  browser-chromium:
    name: "P89 UI móvil Chromium aislado"
    # Playwright 1.56 no soporta Ubuntu 26.04 en los runners latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Instalar Chromium SOLO en el runner descartable"
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: "Pruebas reales de Admin y público en Chromium móvil"
        run: |
          node --check tests/torneos-liga-final89-browser.test.cjs
          node --test tests/torneos-liga-final89-browser.test.cjs
          node --check tests/torneos-reglamento-browser2026.test.cjs
          node --test tests/torneos-reglamento-browser2026.test.cjs
