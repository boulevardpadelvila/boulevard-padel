name: "SQL94 · Seguridad RPC y localhost (aislado)"

on:
  pull_request:
    branches: [main]
    paths:
      - "sql/SQL_94_MINIMO_PRIVILEGIO_RPC.sql"
      - "tests/fixtures/t94_postgres_bootstrap.sql"
      - "tests/fixtures/t94_postgres_smoke.sql"
      - "tests/supabase-security94.test.js"
      - ".github/workflows/supabase-security94.yml"
  push:
    branches: [main]
    paths:
      - "sql/SQL_94_MINIMO_PRIVILEGIO_RPC.sql"
      - "tests/fixtures/t94_postgres_bootstrap.sql"
      - "tests/fixtures/t94_postgres_smoke.sql"
      - "tests/supabase-security94.test.js"
      - ".github/workflows/supabase-security94.yml"
  workflow_dispatch:

jobs:
  sql94-postgresql17:
    name: "SQL94 · PostgreSQL 17 temporal, jamás producción"
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: t94test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: t94_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d t94test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: t94test
      PGUSER: postgres
      PGPASSWORD: t94_ci_only
    steps:
      - uses: actions/checkout@v4
      - name: "Cliente PostgreSQL"
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: "Armar exclusivamente roles y funciones ficticios"
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/t94_postgres_bootstrap.sql
      - name: "Aplicar SQL94 en la base temporal"
        run: psql -X -v ON_ERROR_STOP=1 -f sql/SQL_94_MINIMO_PRIVILEGIO_RPC.sql
      - name: "Probar permisos, RPC públicas y trigger como anon"
        run: psql -X -v ON_ERROR_STOP=1 -f tests/fixtures/t94_postgres_smoke.sql

  node-regresion:
    name: "SQL94 · contrato de acceso público y Admin"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Validar alcance sin acceder a producción"
        run: |
          node --test tests/supabase-security94.test.js
          node --test tests/*.test.js
