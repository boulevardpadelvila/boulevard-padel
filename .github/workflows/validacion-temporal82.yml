name: Validación Liga - sorteo y Fechas
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Suite completa de regresión
        run: node --test tests/*.test.js
